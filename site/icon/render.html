<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>glassity icon</title>
<!-- Renders the glassity app icon with glassity itself. Used by site/icon/render.mjs. -->
<style>
  html, body { margin: 0; background: transparent; }
  .icon {
    width: 1024px; height: 1024px; position: relative; overflow: hidden;
    background: center / cover no-repeat;
    display: grid; place-items: center; color: #fff;
  }
  .icon.round { border-radius: 230px; }
  /* The g fills about 72% of the icon's height. Its ink is centred at (15.5, 16.5) in the mark's 32 box, not (16, 16),
     so the box is moved half a unit right and up to centre the g itself. */
  .icon svg { width: 920px; height: 920px; position: relative; left: 14px; top: -14px; }
</style>
</head>
<body>
<div class="icon" id="icon"></div>
<script type="module">
  const params = new URLSearchParams(location.hash.slice(1));
  const icon = document.getElementById('icon');
  // A background is an image path, or a plain colour such as #000.
  const bg = params.get('bg') ?? '#000';
  if (bg.startsWith('#')) icon.style.backgroundColor = bg;
  else icon.style.backgroundImage = `url("${bg}")`;
  if (params.has('round')) icon.classList.add('round');
  icon.innerHTML = await (await fetch('mark.svg')).text();
  const svg = icon.querySelector('svg');
  const options = JSON.parse(params.get('o') ?? '{}');
  const { glassify } = await import('../../dist/index.js');
  await new Promise((r) => (document.readyState === 'complete' ? r() : addEventListener('load', r)));
  window.handle = glassify(svg, { accessibility: false, pointerLight: false, duration: 0, maxDpr: 2, ...options });
</script>
</body>
</html>
