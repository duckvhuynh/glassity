<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Blue and green checks, as window.drawPattern(canvas, 'b') in backdrops.html. -->
  <defs>
    <pattern id="checks" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="25" height="25" fill="#20c060"/>
      <rect x="25" y="25" width="25" height="25" fill="#20c060"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="#1040ff"/>
  <rect width="200" height="200" fill="url(#checks)"/>
</svg>
