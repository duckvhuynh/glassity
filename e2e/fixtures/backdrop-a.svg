<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Red and yellow stripes, as window.drawPattern(canvas, 'a') in backdrops.html. -->
  <defs>
    <pattern id="stripes" width="20" height="200" patternUnits="userSpaceOnUse">
      <rect width="10" height="200" fill="#ffd400"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="#e2272e"/>
  <rect width="200" height="200" fill="url(#stripes)"/>
</svg>
