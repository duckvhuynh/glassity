<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>glassity e2e: surfaces</title>
<!-- Icon outlines are from Lucide (ISC licence): https://lucide.dev. -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #1d2d2a; background: #eef1ec; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 48px 40px 120px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 28px; font-weight: 550; letter-spacing: -1px; }
  header p, .caption { margin: 0; color: #5e7068; font-size: 13px; }
  button { color: inherit; font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid #1175e7; outline-offset: 5px; }
  svg { display: block; width: 24px; height: 24px; flex: none; }
  #photo-panel {
    position: relative; height: 520px; padding: 36px; border-radius: 32px;
    background: #789575 url('/site/backdrops/meadow.webp') center / cover;
  }
  .photo-title { margin: 0; color: #fff; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; }
  .photo-heading { margin: 6px 0 28px; max-width: 320px; color: #fff; font-size: 36px; font-weight: 500; line-height: 1.15; letter-spacing: -1.4px; }
  #pill { display: inline-flex; align-items: center; justify-content: center; width: 184px; height: 54px; padding: 0 18px; border: 0; border-radius: 999px; background: #dce8d8; font-weight: 600; }
  #photo-toolbar { position: absolute; left: 36px; bottom: 144px; display: flex; align-items: center; gap: 16px; width: 440px; height: 64px; padding: 0 20px; border: 0; border-radius: 24px 8px 20px 4px / 16px 8px 12px 4px; background: #e4e9da; }
  .toolbar-title { flex: 1; font-weight: 600; }
  .tool { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 6px; border: 0; border-radius: 10px; background: transparent; }
  .tool:hover { background: #ffffff40; }
  #tabbar { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; justify-content: space-evenly; width: 360px; height: 80px; padding: 8px 12px; border-radius: 30px; background: #e1e8db; }
  .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-width: 72px; height: 60px; padding: 4px; border: 0; border-radius: 22px; background: transparent; font-size: 11px; }
  .tab[aria-current] { background: #ffffff40; font-weight: 650; }
  #glass-icon { width: 28px; height: 28px; }
  .flat-panel { margin-top: 24px; padding: 28px 36px 36px; border-radius: 28px; background: #d5e4df; }
  .flat-panel .caption { margin-bottom: 20px; }
  #flat-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 20px; width: 440px; height: 72px; padding: 0 22px; border-radius: 18px; background: #e8eeea; }
  #selectable-label { user-select: text; }
  #copy-button { padding: 8px 14px; border: 1px solid #253d3440; border-radius: 10px; background: transparent; font-weight: 600; }
  .status { margin: 22px 0 0; color: #5e7068; font-size: 13px; }
  @media (max-width: 640px) {
    main { padding: 24px 16px 80px; }
    header { display: block; }
    header p { margin-top: 4px; }
    #photo-panel { padding: 24px; }
    #photo-toolbar { left: 24px; width: calc(100% - 48px); }
    #tabbar { width: calc(100% - 32px); max-width: 360px; }
    .flat-panel { padding: 24px; }
    #flat-toolbar { max-width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header><h1>Glass surfaces</h1><p>Ordinary controls. A different material.</p></header>
  <section id="photo-panel" aria-label="Surfaces over a photo">
    <p class="photo-title">Field notes</p>
    <h2 class="photo-heading">A little room<br>to wander.</h2>
    <button id="pill" type="button" data-glass="surface" data-glass-look="clear"><span id="pill-label">Save to collection</span></button>
    <div id="photo-toolbar" role="toolbar" aria-label="Photo tools" data-glass="surface" data-glass-frost="0.24">
      <span class="toolbar-title">Sunday in the valley</span>
      <button class="tool" type="button" aria-label="Favourite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </button>
      <button class="tool" type="button" aria-label="More options">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      </button>
    </div>
    <nav id="tabbar" aria-label="Main navigation" data-glass="surface" data-glass-look="frosted">
      <button class="tab" type="button" aria-current="page">
        <svg id="plain-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 21v-8h6v8"/></svg>
        <span>Explore</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <span>Search</span>
      </button>
      <button class="tab" type="button">
        <svg id="glass-icon" data-glass data-glass-look="clear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z"/></svg>
        <span>Saved</span>
      </button>
    </nav>
  </section>
  <section class="flat-panel" aria-label="Surface over a flat colour">
    <p class="caption">Over a flat colour. This toolbar uses the JavaScript API.</p>
    <div id="flat-toolbar" role="toolbar" aria-label="Text tools">
      <span id="selectable-label">Select this label</span>
      <button id="copy-button" type="button">Copy</button>
    </div>
  </section>
  <p class="status" aria-live="polite">Saved <span id="click-count">0</span> times. Copied <span id="copy-count">0</span> times.</p>
</main>
<script type="module">
  import * as glassity from '/dist/index.js';
  window.glassity = glassity;
  const flat = document.getElementById('flat-toolbar');
  const flatHandle = glassity.glassify(flat, { surface: true, duration: 0, pointerLight: false });
  const controller = glassity.auto({ selector: '[data-glass], svg', duration: 0, pointerLight: false });
  const demo = window.surfaceDemo = {
    controller, flatHandle, clicks: 0, copyClicks: 0,
    resize(width) { flat.style.width = width + 'px'; },
  };
  document.getElementById('pill').addEventListener('click', () => {
    document.getElementById('click-count').textContent = String(++demo.clicks);
  });
  document.getElementById('copy-button').addEventListener('click', () => {
    document.getElementById('copy-count').textContent = String(++demo.copyClicks);
  });
</script>
</body>
</html>
