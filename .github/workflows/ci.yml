name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run demo:build

  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser tests (Chromium, WebKit)
        run: npx playwright test --project=chromium --project=webkit
        env:
          REQUIRE_WEBGL2: '1'
      # Headless Firefox on Linux has no GL context, so it runs headed on a virtual display.
      - name: Browser tests (Firefox)
        run: xvfb-run --auto-servernum npx playwright test --project=firefox --headed
        env:
          REQUIRE_WEBGL2: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  # Install the packed package into Vue, Svelte, Solid and Preact apps and check them
  # in a browser, the way a user of each framework would get it.
  compat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:compat
        env:
          COMPAT_BROWSERS: chromium,webkit
