name: Release

# Push a tag like v0.2.0 (matching "version" in package.json) to publish that version
# to npm and create a GitHub release from the changelog.
#
# Publishing uses npm Trusted Publishing (OIDC): no token or secret. On npmjs.com,
# glassity → Settings → Trusted publishing → GitHub Actions must name this repository
# and the workflow file "release.yml", with direct "npm publish" allowed. npm adds
# provenance on its own for public packages published this way.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # OIDC for npm Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24 ships npm 11; Trusted Publishing needs npm 11.5.1+ and Node 22.14+.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci

      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Already on npm?
        run: |
          if npm view "glassity@$VERSION" version > /dev/null 2>&1; then
            echo "glassity@$VERSION is already published; nothing to publish."
            echo "PUBLISHED=1" >> "$GITHUB_ENV"
          fi

      # prepublishOnly runs typecheck, unit tests and the build.
      - name: Publish to npm
        if: env.PUBLISHED != '1'
        run: npm publish

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The changelog section for this version becomes the release notes.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && (substr($0, 1, 4) == "## [" || substr($0, 1, 1) == "[") { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
