<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>glassity performance fixture</title>
  <style>
    html { background-color: #e9eef4; color: #203247; font: 16px system-ui, sans-serif; }
    html.image { background-image: url('./wallpaper.svg'); background-size: cover; background-attachment: fixed; }
    html.dark { background-color: #182330; color: #e3edf7; }
    html.image.dark { background-color: #263945; background-blend-mode: multiply; }
    body { margin: 0; min-height: 1450px; }
    header { height: 130px; box-sizing: border-box; padding: 32px 5vw 0; }
    h1 { font-size: 22px; font-weight: 500; margin: 0 0 8px; }
    p { margin: 0; }
    main { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); grid-auto-rows: 84px; margin: 0 5vw; }
    button { position: relative; display: grid; place-items: center; color: inherit; background: transparent; border: 0; padding: 0; }
    button:focus-visible { outline: 2px solid currentColor; }
    svg { display: block; overflow: visible; }
    footer { margin: 32px 5vw; font-size: 14px; }
  </style>
</head>
<body>
  <header><h1>glassity performance fixture</h1><p id="description"></p></header>
  <main aria-label="Glass icon grid"></main>
  <footer>Local, deterministic SVG shapes. No external images or fonts.</footer>
  <script type="module" src="./fixture.mjs"></script>
</body>
</html>
